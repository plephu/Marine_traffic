[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnports"
version = "0.1.0"
description = "Thu thap thong tin tau bien du kien cap cang Viet Nam (ETA 0-30 ngay) tu nhieu nguon"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["httpx>=0.27"]

[project.scripts]
vnports = "vnports.cli:main"

[tool.setuptools.packages.find]
include = ["vnports*", "webapp*"]
